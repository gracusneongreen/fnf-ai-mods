name: Sprite Studio Import Tests

on:
  push:
    branches:
      - "feat/fnf-sprite-studio-import-v0.1-clean"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run importer tests
        run: python -m unittest tests.test_sprite_studio_import -v
