services:
  backend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
      - projects_data:/app/projects
    environment:
      - PORT=3001
      - PROJECTS_DIR=/app/projects
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-c", "npm install && npx nodemon src/index.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: node:20-slim
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_API_BASE=/api
    command: ["sh", "-c", "npm install && npx vite --host 0.0.0.0"]
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  projects_data:
